---
- name: Assignment 10 Playbook
  hosts: all
  become: yes
  tasks:

    - name: Update & upgrade apt packages (Ubuntu)
      apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Update & upgrade yum packages (Amazon Linux)
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Install Docker on Ubuntu
      apt:
        name: docker.io
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Docker on Amazon Linux
      yum:
        name: docker
        state: present
      when: ansible_os_family == "RedHat"

    - name: Ensure Docker is running on Ubuntu
      service:
        name: docker
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Ensure Docker is running on Amazon Linux
      service:
        name: docker
        state: started
        enabled: yes
      when: ansible_os_family == "RedHat"

    - name: Check disk usage
      command: df -h
      register: disk_usage

    - name: Show disk usage output
      debug:
        var: disk_usage.stdout_lines
